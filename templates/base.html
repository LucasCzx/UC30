<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Deliverypy{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    
    <nav class="navbar navbar-dark bg-danger p-3">
        <div class="container">
            <a class="navbar-brand" href="/">🍔 DeliveryPy</a>
            <div>
                <a class="text-white text-decoration-none me-3" href="/">Início</a>
                <a class="text-white text-decoration-none" href="/cardapio">Cardápio</a>
            </div>
        </div>
    </nav>

    
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-4 mt-5 bg-light">
        <p class="text-muted">© 2023 - Feito com Flask e Bootstrap</p>
    </footer>

</body>
</html>
