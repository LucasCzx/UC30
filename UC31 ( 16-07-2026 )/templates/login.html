<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Login</h1>

    <form method="post">

        <label>Nome:</label>
        <input type="text" name="nome" required>

        <label>Senha:</label>
        <input type="password" name="senha" required>

        <button type="submit">Entrar</button>

    </form>

    <p class="erro">{{ mensagem }}</p>

</div>

</body>
</html>
